<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temporizadores</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0b0e12;
  --panel:#11161d;
  --panel-2:#161d26;
  --line:#232b34;
  --ink:#e5e9ed;
  --muted:#e7ebef;
  --dim:#8a96a3;
  --accent:#4dd9c0;
  --accent-2:#f2a154;
  --violet:#a78bfa;
  --good:#7cd992;
  --danger:#e2725b;
  --accent-dim:rgba(77,217,192,.12);
  --accent2-dim:rgba(242,161,84,.12);
  --danger-dim:rgba(226,114,91,.12);
  --violet-dim:rgba(167,139,250,.14);
  --fs:1.35;
}
*{box-sizing:border-box;}
html,body{background:var(--bg);}
body{margin:0;color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;padding:10px 20px 140px;}
.wrap{max-width:1400px;margin:0 auto;}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:calc(var(--fs,1) * 11.5px);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center;margin:0 0 12px;}
h1{text-align:center;font-family:"IBM Plex Mono",monospace;font-size:36px;font-weight:600;margin:0 0 10px;text-wrap:balance;}
.sub{text-align:center;color:var(--muted);font-size:calc(var(--fs,1) * 14px);max-width:1400px;margin:0 auto 34px;line-height:1.55;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;}
.term-bar{display:flex;gap:5px;margin-bottom:10px;}
.term-bar span{width:8px;height:8px;border-radius:50%;background:#2a323c;}
.code{font-family:"IBM Plex Mono",monospace;font-size:18px;line-height:1.95;color:#e2e7eb;overflow-x:auto;}
.code .ln{display:block;padding:1px 8px;border-radius:5px;border-left:2px solid transparent;transition:background .25s,border-color .25s,color .25s;white-space:pre;}
.code .ln .k{color:#c99a5b;}
.code .ln .s{color:#7cd992;}
.code .ln .c{color:#6b7785;font-style:italic;}
.code .ln .n{color:#a78bfa;}
.code .ln.active{color:var(--ink);background:var(--accent-dim);border-left-color:var(--accent);}
.code .ln.error{background:var(--danger-dim);border-left-color:var(--danger);}
.lbl{font-family:"IBM Plex Mono",monospace;font-size:calc(var(--fs,1) * 9.5px);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:7px;}
.chip{font-family:"IBM Plex Mono",monospace;font-size:calc(var(--fs,1) * 11.5px);padding:5px 9px;border-radius:6px;background:var(--panel-2);border:1px solid var(--accent);color:var(--accent);display:inline-block;}
.chip.warn{border-color:var(--accent-2);color:var(--accent-2);}
.chip.bad{border-color:var(--danger);color:var(--danger);}
.chip.muted{border-color:var(--line);color:var(--dim);}
.chip.violet{border-color:var(--violet);color:var(--violet);}
@keyframes pop{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
.pop{animation:pop .22s ease forwards;}
.note{font-family:"IBM Plex Mono",monospace;font-size:20px;color:var(--muted);text-align:center;min-height:34px;line-height:1.5;padding:0 10px;margin-top:18px;}
.timeline{max-width:920px;margin:22px auto 0;height:3px;background:var(--line);border-radius:2px;overflow:hidden;}
.timeline-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .05s linear;}
.verdict{text-align:center;margin:22px auto 0;max-width:760px;font-size:calc(var(--fs,1) * 14px);color:var(--muted);line-height:1.6;min-height:30px;opacity:0;transition:opacity .4s;}
.verdict.show{opacity:1;}
.verdict b{color:var(--ink);font-weight:600;}
.controls{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:calc(100% - 32px);max-width:1200px;margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px;z-index:100;box-shadow:0 12px 36px rgba(0,0,0,.5);}
.ctrl-group{display:flex;align-items:center;gap:8px;}
.ctrl-btn{font-family:"IBM Plex Mono",monospace;font-size:calc(var(--fs,1) * 12px);letter-spacing:.03em;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:8px 14px;cursor:pointer;transition:border-color .2s,color .2s;}
.ctrl-btn:hover:not(:disabled){border-color:var(--ink);}
.ctrl-btn:disabled{opacity:.35;cursor:default;}
.ctrl-btn.play{min-width:132px;border-color:var(--accent);color:var(--accent);}
.ctrl-btn.step{font-size:calc(var(--fs,1) * 14px);padding:8px 12px;}
.ctrl-label{font-family:"IBM Plex Mono",monospace;font-size:calc(var(--fs,1) * 10px);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:2px;}
.speed-group{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;}
.speed-btn{font-family:"IBM Plex Mono",monospace;font-size:calc(var(--fs,1) * 11.5px);color:var(--muted);background:var(--panel-2);border:none;padding:7px 11px;cursor:pointer;border-right:1px solid var(--line);transition:background .2s,color .2s;}
.speed-btn:last-child{border-right:none;}
.speed-btn.active{background:var(--accent-dim);color:var(--accent);}
.step-counter{font-family:"IBM Plex Mono",monospace;font-size:calc(var(--fs,1) * 11px);color:var(--muted);margin-left:auto;}
@media (prefers-reduced-motion: reduce){*{transition-duration:.001ms !important;animation-duration:.001ms !important;}}
.stage-lr{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
@media (max-width:760px){.stage-lr{grid-template-columns:1fr;}}
.stage-lr .col-code{display:flex;flex-direction:column;}
.stage-lr .col-code .panel.term{height:100%;}
.stage-lr .col-out{display:flex;flex-direction:column;gap:14px;}
.tabbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;}
.tab-btn{font-family:"IBM Plex Mono",monospace;font-size:calc(var(--fs,1) * 12px);color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:7px 15px;cursor:pointer;transition:border-color .2s,color .2s,background .2s;}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
.term{padding:16px 18px;}
.viz-panel{padding:20px 18px;min-height:260px;}
.out-panel{padding:14px 16px;min-height:50px;}
.out{font-family:"IBM Plex Mono",monospace;font-size:calc(var(--fs,1) * 13px);}
.out span{display:inline-block;margin:2px 8px 2px 0;padding:2px 8px;border-radius:5px;background:var(--panel-2);border:1px solid var(--accent);color:var(--accent);}
.out span.err{border-color:var(--danger);color:var(--danger);}
.out span.new{animation:pop .22s ease forwards;}
/* ---------- estilos propios de esta animación ---------- */
.tabfake{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border:1px solid var(--accent);border-bottom:none;border-radius:9px 9px 0 0;background:var(--accent-dim);font-family:"IBM Plex Mono",monospace;font-size:calc(var(--fs,1) * 12px);color:var(--accent);min-width:150px;}
.tabfake i{width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block;}
.ruler{position:relative;height:84px;border-top:1px solid var(--line);margin:0 0 18px;}
.ruler .tick{position:absolute;top:0;bottom:24px;border-left:1px dashed #2f3843;}
.ruler .tick span{position:absolute;bottom:-22px;left:-12px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--dim);white-space:nowrap;}
.ruler .cursor{position:absolute;top:0;bottom:22px;width:3px;margin-left:-1px;background:var(--accent);border-radius:2px;transition:left .45s ease;box-shadow:0 0 12px var(--accent);}
.ruler .cursor::before{content:"";position:absolute;top:-7px;left:-5px;border:6px solid transparent;border-top-color:var(--accent);}
.ruler .fired{position:absolute;top:30px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--accent-2);animation:pop .22s ease forwards;}
.ruler .fired span{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--accent-2);white-space:nowrap;}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.chip.off{text-decoration:line-through;}

</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">JavaScript · BOM · UP3</p>
  <h1>Temporizadores en acción</h1>
  <p class="sub">setTimeout y setInterval programan código para más tarde sin bloquear la página. Sigue el reloj, los temporizadores activos y el título de la pestaña.</p>

  <div class="tabbar" id="tabbar"></div>
  <div class="stage" id="stage"></div>

  <p class="note" id="note"></p>
  <div class="timeline"><div class="timeline-fill" id="fill"></div></div>
  <p class="verdict" id="verdict"></p>

  <div class="controls">
    <div class="ctrl-group">
      <button id="rewindBtn" class="ctrl-btn step" title="Rebobinar al principio">&#9198;</button>
      <button id="prevBtn" class="ctrl-btn step" title="Paso anterior">&#9664;&#9664;</button>
      <button id="playBtn" class="ctrl-btn play">&#9654; Reproducir</button>
      <button id="nextBtn" class="ctrl-btn step" title="Paso siguiente">&#9654;&#9654;</button>
      <button id="delayPlayBtn" class="ctrl-btn" title="Empezar tras una cuenta atrás de 10s">&#9654; +10s</button>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">Velocidad</span>
      <div class="speed-group">
        <button class="speed-btn active" data-speed="0.25">0.25&times;</button>
        <button class="speed-btn" data-speed="0.5">0.5&times;</button>
        <button class="speed-btn" data-speed="1">1&times;</button>
      </div>
    </div>
    <span class="step-counter" id="stepCounter">Paso 1 / N</span>
  </div>
</div>

<script>
/* =========================================================
   Contenido de esta animación (pestañas, código y pasos)
   ========================================================= */
function T(id, tipo, ms, st) { return { id: id, tipo: tipo, ms: ms, st: st }; }
function F(t, l) { return { t: t, l: l }; }

var TABS = [
  { key: 'timeout', label: 'setTimeout',
    code: [
      ['a', "console.log('A');"],
      ['b', "const id = setTimeout(() => {"],
      ['c', "  console.log('B');"],
      ['d', "}, 2000);"],
      ['e', "console.log('C');"]
    ],
    steps: [
      { t: 0, maxT: 3, timers: [], fired: [], title: 'Mi página', vars: {}, note: 'El script empieza en t = 0 s' },
      { active: 'a', log: 'A', note: 'se ejecuta inmediatamente' },
      { active: ['b', 'd'], timers: [T(1, 'setTimeout', 'tras 2000 ms', 'activo')], vars: { id: 1 }, note: 'se PROGRAMA la función para dentro de 2 s y devuelve el id 1' },
      { active: 'e', log: 'C', note: '¡el script NO espera! sigue con la línea siguiente' },
      { t: 1, note: 'pasa 1 segundo… el temporizador sigue esperando' },
      { t: 2, active: 'c', log: 'B', fired: [F(2, 'B')], timers: [T(1, 'setTimeout', 'tras 2000 ms', 'hecho')], note: 'a los 2 s se ejecuta el callback (una sola vez)' },
      { verdict: 'setTimeout <b>no bloquea</b>: programa la función y el código continúa. Por eso el orden es <b>A → C → B</b>.' }
    ] },
  { key: 'interval', label: 'setInterval',
    code: [
      ['a', "let s = 3;"],
      ['b', "const id = setInterval(() => {"],
      ['c', "  document.title = `${s} s`;"],
      ['d', "  s--;"],
      ['e', "  if (s < 0) clearInterval(id);"],
      ['f', "}, 1000);"]
    ],
    steps: [
      { t: 0, maxT: 5, timers: [], fired: [], title: 'Mi página', vars: { s: 3 }, active: 'a', note: 's empieza valiendo 3' },
      { active: ['b', 'f'], timers: [T(1, 'setInterval', 'cada 1000 ms', 'activo')], vars: { s: 3, id: 1 }, note: 'la función se repetirá cada segundo' },
      { t: 1, active: 'c', title: '3 s', fired: [F(1, '3 s')], note: 't = 1 s → el título pasa a "3 s"' },
      { t: 1, active: 'd', vars: { s: 2, id: 1 }, note: 's-- → 2' },
      { t: 2, active: ['c', 'd'], title: '2 s', vars: { s: 1, id: 1 }, fired: [F(1, '3 s'), F(2, '2 s')], note: 't = 2 s → "2 s" y s = 1' },
      { t: 3, active: ['c', 'd'], title: '1 s', vars: { s: 0, id: 1 }, fired: [F(1, '3 s'), F(2, '2 s'), F(3, '1 s')], note: 't = 3 s → "1 s" y s = 0' },
      { t: 4, active: ['c', 'd'], title: '0 s', vars: { s: -1, id: 1 }, fired: [F(1, '3 s'), F(2, '2 s'), F(3, '1 s'), F(4, '0 s')], note: 't = 4 s → "0 s" y s = −1' },
      { t: 4, active: 'e', timers: [T(1, 'setInterval', 'cada 1000 ms', 'cancelado')], note: 's < 0 → clearInterval(id) detiene el intervalo' },
      { t: 5, note: 't = 5 s → ya no se ejecuta nada' },
      { verdict: 'setInterval se repite <b>hasta que lo cancelas</b> con clearInterval(id). Sin guardar el id no podrías pararlo nunca.' }
    ] },
  { key: 'pausa', label: 'pausar / reanudar',
    code: [
      ['a', "function pausar() {"],
      ['b', "  clearInterval(id);"],
      ['c', "  id = null;"],
      ['d', "}"],
      ['e', "function reanudar() {"],
      ['f', "  if (id === null) id = setInterval(tick, 1000);"],
      ['g', "}"]
    ],
    steps: [
      { t: 0, maxT: 6, timers: [T(1, 'setInterval', 'tick cada 1000 ms', 'activo')], fired: [], title: '5 s', vars: { restantes: 5, id: 1 }, note: 'Cuenta atrás en marcha' },
      { t: 1, title: '4 s', vars: { restantes: 4, id: 1 }, fired: [F(1, '4')], note: 'tick → 4' },
      { t: 2, title: '3 s', vars: { restantes: 3, id: 1 }, fired: [F(1, '4'), F(2, '3')], note: 'tick → 3' },
      { t: 2, active: ['a', 'b'], timers: [T(1, 'setInterval', 'tick cada 1000 ms', 'cancelado')], note: 'clic en Pausar → clearInterval(id)' },
      { t: 2, active: 'c', vars: { restantes: 3, id: null }, title: '⏸ 3 s', note: 'id = null significa "no hay intervalo activo"' },
      { t: 3, note: 'pasa el tiempo… restantes sigue en 3 (no hay ticks)' },
      { t: 4, note: '…sigue en 3: el estado se ha conservado' },
      { t: 4, active: ['e', 'f'], timers: [T(1, 'setInterval', 'tick cada 1000 ms', 'cancelado'), T(2, 'setInterval', 'tick cada 1000 ms', 'activo')], vars: { restantes: 3, id: 2 }, title: '3 s', note: 'Reanudar → id es null, así que se crea un intervalo NUEVO (id 2)' },
      { t: 5, title: '2 s', vars: { restantes: 2, id: 2 }, fired: [F(1, '4'), F(2, '3'), F(5, '2')], note: 'tick → 2' },
      { t: 6, title: '1 s', vars: { restantes: 1, id: 2 }, fired: [F(1, '4'), F(2, '3'), F(5, '2'), F(6, '1')], note: 'tick → 1' },
      { verdict: 'Pausar = <b>clearInterval + conservar el estado</b> (restantes). Reanudar = <b>crear otro intervalo</b>. El <b>if (id === null)</b> evita tener dos a la vez.' }
    ] },
  { key: 'duplicado', label: 'error: intervalo doble',
    code: [
      ['a', "btnIniciar.addEventListener('click', () => {"],
      ['b', "  id = setInterval(tick, 1000); // ❌ sin comprobar"],
      ['c', "});"],
      ['d', "btnPausar.addEventListener('click', () => {"],
      ['e', "  clearInterval(id);"],
      ['f', "});"]
    ],
    steps: [
      { t: 0, maxT: 5, timers: [], fired: [], title: '10 s', vars: { restantes: 10, id: null }, note: 'Nadie comprueba si ya hay un intervalo en marcha' },
      { active: ['a', 'b'], timers: [T(1, 'setInterval', 'tick', 'activo')], vars: { restantes: 10, id: 1 }, note: '1.er clic en Iniciar → intervalo 1' },
      { active: ['a', 'b'], timers: [T(1, 'setInterval', 'tick', 'activo'), T(2, 'setInterval', 'tick', 'activo')], vars: { restantes: 10, id: 2 }, note: '2.º clic (impaciente) → intervalo 2… y id se SOBRESCRIBE' },
      { t: 1, title: '8 s', vars: { restantes: 8, id: 2 }, fired: [F(1, '−2')], note: '¡cada segundo se ejecutan DOS ticks!' },
      { t: 2, title: '6 s', vars: { restantes: 6, id: 2 }, fired: [F(1, '−2'), F(2, '−2')], note: 'la cuenta atrás va al doble de velocidad' },
      { t: 2, active: ['d', 'e'], timers: [T(1, 'setInterval', 'tick', 'fantasma'), T(2, 'setInterval', 'tick', 'cancelado')], note: 'Pausar → clearInterval(id) solo cancela el intervalo 2' },
      { t: 3, title: '5 s', vars: { restantes: 5, id: 2 }, fired: [F(1, '−2'), F(2, '−2'), F(3, '−1')], note: 'el intervalo 1 sigue vivo… y ya ninguna variable guarda su id' },
      { t: 4, title: '4 s', vars: { restantes: 4, id: 2 }, fired: [F(1, '−2'), F(2, '−2'), F(3, '−1'), F(4, '−1')], note: 'no se puede parar: es un intervalo "fantasma"' },
      { verdict: 'Antes de crear un intervalo comprueba si ya hay uno (<b>if (id === null)</b>) o deshabilita el botón. Un intervalo cuyo id has perdido <b>no se puede detener</b>.' }
    ] }
];

var RENDER = {
  main: function (viz, s) {
    var pct = function (t) { return (t / s.maxT * 92 + 4) + '%'; };
    var ticks = '';
    for (var i = 0; i <= s.maxT; i++) ticks += '<div class="tick" style="left:' + pct(i) + '"><span>' + i + ' s</span></div>';
    var fired = (s.fired || []).map(function (f) {
      return '<div class="fired" style="left:' + pct(f.t) + '"><span>' + f.l + '</span></div>';
    }).join('');
    var timers = (s.timers || []).length
      ? s.timers.map(function (t) {
          var cls = { activo: '', hecho: 'muted', cancelado: 'muted off', fantasma: 'bad' }[t.st];
          return '<span class="chip ' + cls + '">#' + t.id + ' ' + t.tipo + ' · ' + t.ms + ' · ' + t.st + '</span>';
        }).join('')
      : '<span class="chip muted">ninguno</span>';
    var vars = Object.keys(s.vars || {}).map(function (k) {
      return '<span class="chip violet">' + k + ' = ' + s.vars[k] + '</span>';
    }).join('') || '<span class="chip muted">—</span>';
    viz.innerHTML =
      '<div class="tabfake"><i></i>' + s.title + '</div>' +
      '<div class="ruler">' + ticks + fired + '<div class="cursor" style="left:' + pct(s.t) + '"></div></div>' +
      '<span class="lbl">Temporizadores activos</span><div class="row">' + timers + '</div>' +
      '<span class="lbl" style="margin-top:14px">Variables</span><div class="row">' + vars + '</div>';
  }
};


/* =========================================================
   Motor común de animaciones paso a paso
   ========================================================= */
var STEP_MS = 550;
var KEYWORDS = /\b(const|let|var|function|if|else|return|new|true|false|null|undefined|while|do|for|of|in|break|typeof|try|catch)\b/;

function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hl(src){
  var re = /(\/\/.*$)|('[^']*'|"[^"]*"|`[^`]*`)|\b(const|let|var|function|if|else|return|new|true|false|null|undefined|while|do|for|of|in|break|typeof|try|catch)\b|(\b\d+\b)/g;
  var out = '', last = 0, m;
  while((m = re.exec(src)) !== null){
    out += esc(src.slice(last, m.index));
    var cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'k' : 'n';
    out += '<span class="'+cls+'">'+esc(m[0])+'</span>';
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

var VOLATILE = ['note','verdict','active','log','error','errLog'];
function buildStates(steps){
  var states = [], prev = { out: [] };
  steps.forEach(function(p){
    var s = Object.assign({}, prev);
    VOLATILE.forEach(function(k){ delete s[k]; });
    Object.assign(s, p);
    s.out = p.clearOut ? [] : prev.out.slice();
    s.newOut = 0;
    if(p.log !== undefined){ [].concat(p.log).forEach(function(v){ s.out.push({t:v}); s.newOut++; }); }
    if(p.errLog !== undefined){ [].concat(p.errLog).forEach(function(v){ s.out.push({t:v, err:true}); s.newOut++; }); }
    prev = s; states.push(s);
  });
  return states;
}

var TAB_ORDER = TABS.map(function(t){ return t.key; });
var DATA = {};
TABS.forEach(function(t){ DATA[t.key] = t; t.states = buildStates(t.steps); });
var currentTab = TAB_ORDER[0];

(function buildDom(){
  var bar = document.getElementById('tabbar'), stage = document.getElementById('stage');
  TABS.forEach(function(t, i){
    var b = document.createElement('button');
    b.className = 'tab-btn' + (i === 0 ? ' active' : '');
    b.dataset.tab = t.key; b.textContent = t.label; bar.appendChild(b);
    var lines = t.code.map(function(l){ return '<span class="ln" data-i="'+l[0]+'">'+(l[1] === '' ? ' ' : hl(l[1]))+'</span>'; }).join('');
    var p = document.createElement('div');
    p.className = 'tab-panel' + (i === 0 ? ' active' : '');
    p.dataset.tab = t.key;
    p.innerHTML =
      '<div class="stage-lr">' +
        '<div class="col-code"><div class="panel term"><div class="term-bar"><span></span><span></span><span></span></div>' +
          (t.file ? '<span class="lbl">'+esc(t.file)+'</span>' : '') +
          '<div class="code">'+lines+'</div></div></div>' +
        '<div class="col-out">' +
          '<div class="panel viz-panel"><span class="lbl">'+esc(t.vizLabel || 'Navegador')+'</span><div class="viz"></div></div>' +
          '<div class="panel out-panel"><span class="lbl">Consola</span><div class="out"></div></div>' +
        '</div>' +
      '</div>';
    stage.appendChild(p);
  });
})();

var playBtn = document.getElementById('playBtn');
var prevBtn = document.getElementById('prevBtn');
var nextBtn = document.getElementById('nextBtn');
var rewindBtn = document.getElementById('rewindBtn');
var delayPlayBtn = document.getElementById('delayPlayBtn');
var stepCounter = document.getElementById('stepCounter');
var fill = document.getElementById('fill');
var verdict = document.getElementById('verdict');
var note = document.getElementById('note');
var speedBtns = document.querySelectorAll('.speed-btn');
var tabBtns = document.querySelectorAll('.tab-btn');
var curIndex = 0, playing = false, speed = 0.25, playTimer = null, countdownTimer = null;

function renderVisual(tabKey, s){
  var root = document.querySelector('.tab-panel[data-tab="'+tabKey+'"]');
  var active = [].concat(s.active || []);
  root.querySelectorAll('.code .ln').forEach(function(el){
    var id = el.getAttribute('data-i');
    el.classList.toggle('active', active.indexOf(id) !== -1 && s.error !== id);
    el.classList.toggle('error', s.error === id);
  });
  RENDER[DATA[tabKey].render || 'main'](root.querySelector('.viz'), s, tabKey);
  var n = s.out.length;
  root.querySelector('.out').innerHTML = s.out.map(function(o, i){
    return '<span class="'+(o.err ? 'err ' : '')+(i >= n - s.newOut ? 'new' : '')+'">'+esc(o.t)+'</span>';
  }).join('');
}

function show(i){
  var data = DATA[currentTab], s = data.states[i];
  renderVisual(currentTab, s);
  note.textContent = s.note || '';
  verdict.innerHTML = s.verdict || '';
  verdict.classList.toggle('show', !!s.verdict);
  fill.style.width = (data.states.length > 1 ? i / (data.states.length - 1) * 100 : 100) + '%';
  stepCounter.textContent = 'Paso ' + (i+1) + ' / ' + data.states.length;
  prevBtn.disabled = (i === 0);
  nextBtn.disabled = (i === data.states.length - 1);
}

function stopCountdown(){
  if(countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
  delayPlayBtn.textContent = '▶ +10s';
  playBtn.disabled = false;
}
function stopPlay(){ playing = false; playBtn.textContent = '▶ Reproducir'; clearTimeout(playTimer); }
function scheduleNext(){
  var data = DATA[currentTab];
  if(curIndex >= data.states.length - 1){ stopPlay(); return; }
  var dur = (data.states[curIndex].ms || STEP_MS) / speed;
  playTimer = setTimeout(function(){ curIndex++; show(curIndex); scheduleNext(); }, dur);
}
function startPlay(){
  var data = DATA[currentTab];
  if(curIndex >= data.states.length - 1){ curIndex = 0; show(0); }
  playing = true; playBtn.textContent = '❘❘ Pausar'; scheduleNext();
}

playBtn.addEventListener('click', function(){ stopCountdown(); playing ? stopPlay() : startPlay(); });
prevBtn.addEventListener('click', function(){ stopCountdown(); stopPlay(); curIndex = Math.max(0, curIndex - 1); show(curIndex); });
nextBtn.addEventListener('click', function(){ stopCountdown(); stopPlay(); var d = DATA[currentTab]; curIndex = Math.min(d.states.length - 1, curIndex + 1); show(curIndex); });
rewindBtn.addEventListener('click', function(){ stopCountdown(); stopPlay(); curIndex = 0; show(0); });
speedBtns.forEach(function(b){ b.addEventListener('click', function(){ speedBtns.forEach(function(x){ x.classList.remove('active'); }); b.classList.add('active'); speed = parseFloat(b.getAttribute('data-speed')); }); });
delayPlayBtn.addEventListener('click', function(){
  if(countdownTimer){ stopCountdown(); return; }
  stopPlay();
  var remaining = 10; playBtn.disabled = true; delayPlayBtn.textContent = 'Empieza en ' + remaining + 's…';
  countdownTimer = setInterval(function(){
    remaining--;
    if(remaining <= 0){ clearInterval(countdownTimer); countdownTimer = null; delayPlayBtn.textContent = '▶ +10s'; playBtn.disabled = false; startPlay(); }
    else { delayPlayBtn.textContent = 'Empieza en ' + remaining + 's…'; }
  }, 1000);
});
tabBtns.forEach(function(b){
  b.addEventListener('click', function(){
    stopCountdown(); stopPlay();
    currentTab = b.getAttribute('data-tab');
    tabBtns.forEach(function(x){ x.classList.remove('active'); });
    b.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.toggle('active', p.getAttribute('data-tab') === currentTab); });
    curIndex = 0; show(0);
  });
});
document.addEventListener('keydown', function(e){
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) return;
  var advance = ['ArrowRight','ArrowDown','PageDown',' ','Spacebar'];
  var back = ['ArrowLeft','ArrowUp','PageUp','Backspace'];
  if(advance.indexOf(e.key) !== -1){ e.preventDefault(); nextBtn.click(); }
  else if(back.indexOf(e.key) !== -1){ e.preventDefault(); prevBtn.click(); }
});
show(0);
</script>
</body>
</html>
