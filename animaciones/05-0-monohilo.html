<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UP5 · El motor de JavaScript es monohilo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root { --bg:#0b0e12; --panel:#11161d; --panel-2:#161d26; --line:#232b34; --ink:#e5e9ed; --muted:#c9d1d9;
          --dim:#8a96a3; --accent:#4dd9c0; --accent-2:#f2a154; --violet:#a78bfa; --good:#7cd992;
          --accent-dim:rgba(77,217,192,.12);
          --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
          --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body { margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--sans); padding-bottom: 130px; }
  main { max-width: 1400px; margin: 0 auto; padding: 18px 20px 20px; }
  h1 { margin: 0 0 14px; font-size: clamp(1.5rem, 2.6vw, 2.2rem); font-weight: 700; letter-spacing: -.01em; color: var(--ink); }

  .layout { display: grid; grid-template-columns: 400px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }

  /* ---------- código ---------- */
  .tarjeta { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .lbl { display: block; margin: 0 0 8px; font: 500 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  #codigo { font: 14px/1.9 var(--mono); overflow-x: auto; }
  .linea { white-space: pre; padding: 1px 8px 1px 0; border-left: 2px solid transparent; border-radius: 4px; color: #cfd6dd; transition: background .25s; }
  .linea::before { content: attr(data-n); display: inline-block; width: 22px; margin-right: 10px; text-align: right; color: var(--dim); }
  .linea.activa { background: var(--accent-dim); border-left-color: var(--accent); color: var(--ink); }
  .cbcode { border-radius: 3px; transition: background .25s; }
  .cbcode.activa { background: rgba(242, 161, 84, .22); outline: 1px solid var(--accent-2); }
  .pista { margin: 12px 0 0; font-size: 1rem; color: var(--muted); line-height: 1.5; }
  .ayuda { margin: 12px 0 0; font: 400 11px var(--mono); color: var(--dim); }

  /* ---------- escena ---------- */
  #escena { width: 100%; height: auto; display: block; }
  #caption { margin: 10px 2.5% 0 3.7%; background: var(--panel); border: 1px solid var(--line); color: #fff; border-radius: 10px;
             padding: 14px 20px; min-height: 4.4em; display: flex; align-items: center; justify-content: center;
             text-align: center; font-size: clamp(15px, 1.45vw, 21px); line-height: 1.4; }

  .panel { fill: url(#gPanel); stroke: var(--line); stroke-width: 1.5; }
  .titulo-panel { fill: var(--ink); font: 600 21px var(--sans); text-anchor: middle; }
  .rotulo { fill: #fff; font: 700 17px var(--sans); text-anchor: middle; }
  .rotulo2 { fill: #fff; font: 600 15px var(--sans); text-anchor: middle; }
  .caja-api { stroke-width: 1.5; }
  .api-txt { fill: #fff; font: 700 19px var(--sans); text-anchor: middle; }
  .pila-caja { fill: var(--panel-2); stroke: var(--line); stroke-width: 1.5; }
  .actual rect { fill: var(--bg); stroke: var(--accent); stroke-width: 1.2; }
  .actual text { fill: var(--ink); font: 500 13px var(--mono); text-anchor: middle; }
  #actual { transition: opacity .4s; }

  .consola-caja { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
  .consola-tit { fill: var(--muted); font: 500 12px var(--mono); }
  .salida { fill: var(--ink); font: 600 13px var(--mono); }
  .salida.nuevo { animation: destello 1.4s ease-out; }
  @keyframes destello { from { fill: #f2a154; } to { fill: #e5e9ed; } }

  .cola-caja { fill: var(--panel-2); stroke: var(--line); stroke-width: 1.5; }
  .cola-hueco { fill: var(--bg); stroke: #2f3b47; stroke-width: 1.2; }
  .tl { fill: var(--accent-2); font: 600 12px var(--mono); opacity: 0; transition: opacity .4s; }
  .tl.on { opacity: 1; }

  /* piezas que viajan */
  .chip { transition: transform .85s cubic-bezier(.5, .05, .2, 1), opacity .5s ease; pointer-events: none; }
  .inicial .chip { transition: none; }
  .chip rect { width: 132px; height: 26px; rx: 5; }
  .chip text { font: 600 12px var(--mono); text-anchor: middle; }
  .chip.azul rect { fill: var(--accent); stroke: #a6f0e2; }
  .chip.azul text { fill: #06231e; }
  .chip.verde rect { fill: var(--good); stroke: #bdf0c9; }
  .chip.verde text { fill: #0a2a14; }
  .chip.main rect { fill: var(--violet); stroke: #d3c8fd; }
  .chip.main text { fill: #1b1236; }
  .chip.cb rect { width: 112px; fill: var(--panel-2); stroke: var(--accent-2); stroke-width: 2; }
  .chip.cb text { fill: var(--ink); }

  /* flechas */
  .flecha { opacity: .22; transition: opacity .4s; }
  .flecha.on { opacity: 1; }
  .flecha path.l { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 6; }
  .flecha.on path.l { animation: flujo .7s linear infinite; }
  @keyframes flujo { to { stroke-dashoffset: -14; } }
  .etq { font: 600 11px var(--sans); text-anchor: middle; opacity: 0; transition: opacity .4s; }
  .etq.on { opacity: 1; }

  /* bucle de eventos */
  #bucle rect { stroke: var(--accent); stroke-width: 1.5; transition: stroke .3s; }
  #bucle.activo { filter: drop-shadow(0 0 10px rgba(77, 217, 192, .75)); }
  #bucle.activo rect { stroke: #c4f6ec; }
  .girar { animation: girar 6s linear infinite; }
  #bucle.activo .girar { animation-duration: 1.1s; }
  @keyframes girar { to { transform: rotate(360deg); } }

  /* ---------- barra de controles (como en el ejemplo de Web Storage) ---------- */
  .controls { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); width: calc(100% - 24px); max-width: 1100px;
              background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; display: flex;
              flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; z-index: 100;
              box-shadow: 0 12px 36px rgba(0, 0, 0, .5); }
  .ctrl-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .ctrl-btn { font: 500 12px var(--mono); color: var(--ink); background: var(--panel-2); border: 1px solid var(--line);
              border-radius: 7px; padding: 8px 12px; cursor: pointer; }
  .ctrl-btn:hover:not(:disabled) { border-color: var(--ink); }
  .ctrl-btn:disabled { opacity: .35; cursor: default; }
  .ctrl-btn.play { min-width: 124px; border-color: var(--accent); color: var(--accent); }
  .ctrl-btn.next { border-color: var(--accent); color: var(--accent); }
  .speed-group { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .speed-btn { font: 500 11px var(--mono); color: var(--muted); background: var(--panel-2); border: none; padding: 7px 10px;
               cursor: pointer; border-right: 1px solid var(--line); }
  .speed-btn:last-child { border-right: none; }
  .speed-btn.active { background: var(--accent-dim); color: var(--accent); }
  .step-counter { font: 500 11px var(--mono); color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .001ms !important; } }
</style>
</head>
<body class="inicial">
<main>
  <h1>El motor de JavaScript es monohilo: cómo delega tareas</h1>

    <aside>

    <section>
      <svg id="escena" viewBox="0 0 954 382" role="img"
           aria-label="Diagrama animado: pila de llamadas, Web APIs, cola de tareas y bucle de eventos">
        <defs>
          <linearGradient id="gPanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141b23"/><stop offset="1" stop-color="#10161d"/></linearGradient>

          <marker id="m-azul" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4dd9c0"/></marker>

          <marker id="m-rojo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f2a154"/></marker>
        </defs>

        <!-- Paneles -->
        <rect class="panel" x="35" y="8" width="425" height="373" rx="14"/>
        <rect class="panel" x="497" y="8" width="433" height="373" rx="14"/>
        <text class="titulo-panel" x="247.5" y="38">Motor de JavaScript</text>
        <text class="titulo-panel" x="713.5" y="38">Entorno del navegador (Web APIs)</text>

          <rect x="226" y="124" width="164" height="26" rx="5"/>

        </g>

        <!-- Consola -->
        <rect class="consola-caja" x="60" y="280" width="145" height="92" rx="6"/>
        <circle cx="72" cy="294" r="4" fill="#f2a154"/>
        <text class="consola-tit" x="82" y="298">Consola</text>
        <text class="salida" id="s0" x="72" y="316"></text>
        <text class="salida" id="s1" x="72" y="331"></text>
        <text class="salida" id="s2" x="72" y="346"></text>
        <text class="salida" id="s3" x="72" y="361"></text>

        <g id="bucle">
          <rect x="225" y="256" width="187" height="115" rx="20" fill="url(#gBucle)"/>

        <!-- Web APIs -->
        <rect class="caja-api" x="520" y="71" width="183" height="46" rx="7" fill="url(#gTeal)" stroke="#4dd9c0"/>

        <!-- Flechas -->
        <g class="flecha" id="f-pila"><path class="l" stroke="#4dd9c0" marker-end="url(#m-azul)" d="M137 238 V 148 Q 137 137 148 137 H 220"/></g>
        <g class="flecha" id="f-dom" style="opacity:.22"><path class="l" stroke="#4dd9c0" marker-end="url(#m-azul)" d="M392 137 H 426 Q 436 137 436 127 V 104 Q 436 94 446 94 H 514"/></g>
        <g class="flecha" id="f-temp"><path class="l" stroke="#7cd992" marker-end="url(#m-verde)" d="M392 137 H 426 Q 436 137 436 147 V 160 Q 436 171 447 171 H 514"/></g>

        <g class="flecha" id="f-azul"><path class="l" stroke="#4dd9c0" marker-end="url(#m-azul)" d="M520 334 H 422"/></g>

        <!-- Piezas que se mueven (siempre encima) -->
        <g class="chip main" id="c-fMain"><rect/><text x="66" y="17.5">script (global)</text></g>
        <g class="chip azul" id="c-fA"><rect/><text x="66" y="17.5">console.log('A')</text></g>
        <g class="chip verde" id="c-fT0"><rect/><text x="66" y="17.5">setTimeout(…)</text></g>
        <g class="chip azul" id="c-fC"><rect/><text x="66" y="17.5">console.log('C')</text></g>
        <g class="chip verde" id="c-fT3"><rect/><text x="66" y="17.5">setTimeout(…)</text></g>
        <g class="chip azul" id="c-fB"><rect/><text x="66" y="17.5">console.log('B')</text></g>
        <g class="chip azul" id="c-fD"><rect/><text x="66" y="17.5">console.log('D')</text></g>
        <g class="chip cb" id="c-cbB"><rect/><text x="56" y="17.5">() =&gt; log('B')</text></g>
        <g class="chip cb" id="c-cbD"><rect/><text x="56" y="17.5">() =&gt; log('D')</text></g>
      </svg>
      <div id="caption"></div>

</main>

<div class="controls">
  <div class="ctrl-row">
    <button class="ctrl-btn" id="rebobinar">⏮ Rebobinar</button>
    <button class="ctrl-btn" id="anterior">◀ Anterior</button>
    <button class="ctrl-btn play" id="ejecutar">▶ Reproducir</button>
    <button class="ctrl-btn next" id="siguiente">Siguiente ▶</button>
  </div>
  <div class="ctrl-row">
    <div class="speed-group">
      <button class="speed-btn" data-s="0.5">0,5×</button>
      <button class="speed-btn active" data-s="1">1×</button>
      <button class="speed-btn" data-s="2">2×</button>
    </div>
    <span class="step-counter" id="contador"></span>
  </div>
</div>

<script>
'use strict';

/* ---------- Qué es cada pieza que se mueve ---------- */
const CHIPS = {
  fMain: { largo: 'script (global)' },
  fA:  { largo: "console.log('A')" },
  fT0: { largo: 'setTimeout(cb, 0)' },
  fC:  { largo: "console.log('C')" },
  fT3: { largo: 'setTimeout(cb, 3000)' },
  fB:  { largo: "console.log('B')" },
  fD:  { largo: "console.log('D')" },
  cbB: { largo: "() => log('B')" },
  cbD: { largo: "() => log('D')" }
};
const SALIDAS = ['A', 'C', 'B', 'D'];
const FRASE = 'Lo asíncrono se entrega al navegador, vuelve a una cola y espera a que la pila quede vacía.';
const BASE = 2400;     // ms entre pasos a 1×

/* ---------- El guion: un estado por cada paso ---------- */
const base = { linea: 0, parte: null, pila: [], cbB: null, cbD: null, consola: 0, flechas: [], bucle: false };
const E = (texto, cambios) => Object.assign({}, base, { texto }, cambios);
const M = 'fMain';

const ESTADOS = [
  /* 0 */ E(FRASE, {}),
  /* 1 */ E('Arranca el script: entra en la pila como un bloque y va ejecutando sus líneas de una en una.',
            { pila: [M], flechas: ['pila'] }),
  /* 2 */ E("Línea 1: console.log('A') entra en la pila, encima del script.",
            { linea: 1, pila: [M, 'fA'], flechas: ['pila'] }),
  /* 3 */ E('Se ejecuta: imprime A y sale de la pila. El script sigue dentro.',
            { linea: 1, pila: [M], consola: 1, flechas: ['pila'] }),
  /* 4 */ E('Línea 2: setTimeout(…, 0) entra en la pila.',
            { linea: 2, pila: [M, 'fT0'], consola: 1, flechas: ['pila'] }),
  /* 5 */ E('setTimeout no espera: entrega el temporizador de 0 ms y su callback B al navegador (Web APIs).',
            { linea: 2, pila: [M, 'fT0'], consola: 1, cbB: 'timer', flechas: ['pila', 'temp'] }),
  /* 6 */ E('setTimeout sale de la pila. El navegador cuenta el tiempo por su cuenta, sin bloquear nada.',
            { linea: 2, pila: [M], consola: 1, cbB: 'timer', flechas: ['pila'] }),
  /* 7 */ E('Vence el temporizador de 0 ms: el callback B pasa a la cola de tareas. Pero la pila sigue ocupada por el script, así que B espera.',
            { linea: 2, pila: [M], consola: 1, cbB: 'cola', flechas: ['pila', 'abajo', 'rojo'], bucle: true }),
  /* 8 */ E("Línea 3: console.log('C') entra en la pila. B sigue esperando en la cola.",
            { linea: 3, pila: [M, 'fC'], consola: 1, cbB: 'cola', flechas: ['pila', 'rojo'], bucle: true }),
  /* 9 */ E('Se ejecuta: imprime C y sale de la pila. C sale antes que B, aunque B pidió 0 ms.',
            { linea: 3, pila: [M], consola: 2, cbB: 'cola', flechas: ['pila', 'rojo'], bucle: true }),
  /* 10 */ E('Línea 4: setTimeout(…, 3000) entra en la pila.',
            { linea: 4, pila: [M, 'fT3'], consola: 2, cbB: 'cola', flechas: ['pila', 'rojo'], bucle: true }),
  /* 11 */ E('Entrega al navegador un segundo temporizador, de 3 segundos, con su callback D. Esos 3 s los cuenta el navegador, no JavaScript.',
            { linea: 4, pila: [M, 'fT3'], consola: 2, cbB: 'cola', cbD: 'timer', flechas: ['pila', 'temp', 'rojo'], bucle: true }),
  /* 12 */ E('setTimeout sale de la pila. Era la última línea del script.',
            { linea: 4, pila: [M], consola: 2, cbB: 'cola', cbD: 'timer', flechas: ['pila', 'rojo'], bucle: true }),
  /* 13 */ E('El script termina y sale de la pila: la pila queda vacía. Ahora el bucle de eventos puede actuar.',
            { consola: 2, cbB: 'cola', cbD: 'timer', flechas: ['azul'], bucle: true }),
  /* 14 */ E('El bucle de eventos coge B de la cola y la empuja a la pila.',
            { parte: 'B', pila: ['cbB'], consola: 2, cbD: 'timer', flechas: ['pila', 'azul'], bucle: true }),
  /* 15 */ E("El callback B llama a console.log('B'), que entra en la pila.",
            { parte: 'B', pila: ['cbB', 'fB'], consola: 2, cbD: 'timer', flechas: ['pila'] }),
  /* 16 */ E('Imprime B y el callback termina: pila y cola vacías. El temporizador de 3 s sigue contando en el navegador.',
            { consola: 3, cbD: 'timer' }),
  /* 17 */ E('Pasan los 3 segundos: el callback D pasa a la cola de tareas.',
            { consola: 3, cbD: 'cola', flechas: ['abajo'], bucle: true }),
  /* 18 */ E('La pila está vacía: el bucle de eventos coge D de la cola y la empuja a la pila.',
            { parte: 'D', pila: ['cbD'], consola: 3, flechas: ['pila', 'azul'], bucle: true }),
  /* 19 */ E("El callback D llama a console.log('D'), que entra en la pila.",
            { parte: 'D', pila: ['cbD', 'fD'], consola: 3, flechas: ['pila'] }),
  /* 20 */ E('Imprime D. Orden de salida: A, C, B, D. ' + FRASE, { consola: 4 })
];
const TOTAL = ESTADOS.length - 1;

/* ---------- Posiciones (unidades del SVG) ---------- */
const TIMER = { cbB: { x: 533, y: 178 }, cbD: { x: 533, y: 208 } };
function posicion(id, est) {
  const i = est.pila.indexOf(id);
  if (i >= 0) return { x: 71, y: 240 - i * 32, op: 1 };
  if (id === 'cbB' || id === 'cbD') {
    if (est[id] === 'timer') return { x: TIMER[id].x, y: TIMER[id].y, op: 1 };
    if (est[id] === 'cola') return { x: 546, y: 319, op: 1 };
    return { x: 71, y: 240, op: 0 };                              // se desvanece en la pila
  }
  const hueco = id === 'fMain' ? 0 : 1;
  return { x: 71, y: 240 - hueco * 32 - 30, op: 0 };             // sale hacia arriba
}

/* ---------- Pintado ---------- */
const $ = (s) => document.querySelector(s);
const $caption = $('#caption');
const $actualTxt = $('#actualTxt');
const FLECHAS = { pila: '#f-pila', temp: '#f-temp', abajo: '#f-abajo', rojo: '#f-rojo', azul: '#f-azul' };
let pos = 0;
let reproduciendo = false;
let temporizador = null;
let velocidad = 1;
let consolaAnterior = 0;

function pintar(k) {
  const e = ESTADOS[k];
  pos = k;

  Object.keys(CHIPS).forEach((id) => {
    const p = posicion(id, e);
    const g = $('#c-' + id);
    g.style.transform = 'translate(' + p.x + 'px, ' + p.y + 'px)';
    g.style.opacity = p.op;
  });
  $('#tl-B').classList.toggle('on', e.cbB === 'timer');
  $('#tl-D').classList.toggle('on', e.cbD === 'timer');

  const tope = e.pila[e.pila.length - 1];
  $actualTxt.textContent = tope ? CHIPS[tope].largo : '';
  $('#actual').style.opacity = tope ? 1 : 0;

  Object.keys(FLECHAS).forEach((n) => $(FLECHAS[n]).classList.toggle('on', e.flechas.includes(n)));
  $('#l-rojo').classList.toggle('on', e.flechas.includes('rojo'));
  $('#l-azul').classList.toggle('on', e.flechas.includes('azul'));
  $('#bucle').classList.toggle('activo', e.bucle);

  SALIDAS.forEach((txt, i) => {
    const t = $('#s' + i);
    t.textContent = i < e.consola ? txt : '';
    t.classList.remove('nuevo');
    if (i === e.consola - 1 && e.consola > consolaAnterior) { void t.getBoundingClientRect(); t.classList.add('nuevo'); }
  });
  consolaAnterior = e.consola;

  document.querySelectorAll('#codigo .linea').forEach((l, i) => l.classList.toggle('activa', e.linea === i + 1));
  $('#cbB').classList.toggle('activa', e.parte === 'B');
  $('#cbD').classList.toggle('activa', e.parte === 'D');

  $caption.textContent = e.texto;
  $('#anterior').disabled = k === 0;
  $('#rebobinar').disabled = k === 0;
  $('#siguiente').disabled = k === TOTAL;
  $('#contador').textContent = 'Paso ' + k + ' / ' + TOTAL;
  $('#ejecutar').textContent = reproduciendo ? '❚❚ Pausa' : '▶ Reproducir';
}

/* ---------- Reproducción automática ---------- */
function parar() { clearTimeout(temporizador); reproduciendo = false; }
function auto() {
  if (!reproduciendo) return;
  if (pos >= TOTAL) { parar(); pintar(pos); return; }
  temporizador = setTimeout(() => { pintar(pos + 1); auto(); }, BASE / velocidad);
}

$('#siguiente').addEventListener('click', () => { parar(); if (pos < TOTAL) pintar(pos + 1); else pintar(pos); });
$('#anterior').addEventListener('click', () => { parar(); if (pos > 0) pintar(pos - 1); });
$('#rebobinar').addEventListener('click', () => { parar(); consolaAnterior = 0; pintar(0); });
$('#ejecutar').addEventListener('click', () => {
  if (reproduciendo) { parar(); pintar(pos); return; }
  if (pos >= TOTAL) { consolaAnterior = 0; pintar(0); }
  reproduciendo = true;
  pintar(pos);
  auto();
});
document.querySelectorAll('.speed-btn').forEach((b) => b.addEventListener('click', () => {
  velocidad = Number(b.dataset.s);
  document.querySelectorAll('.speed-btn').forEach((x) => x.classList.toggle('active', x === b));
  if (reproduciendo) { clearTimeout(temporizador); auto(); }
}));
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowRight' || ev.key === 'PageDown') { ev.preventDefault(); $('#siguiente').click(); }
  else if (ev.key === 'ArrowLeft' || ev.key === 'PageUp') { ev.preventDefault(); $('#anterior').click(); }
});

pintar(0);
requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('inicial')));
</script>
</body>
